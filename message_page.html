{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm text-center">
      <div class="card-body p-5">
        <h1 class="h4">{{ title }}</h1>
        <p class="text-muted">{{ message }}</p>
        {% if link_url %}<a class="btn btn-primary" href="{{ link_url }}">{{ link_label }}</a>{% else %}<a class="btn btn-primary" href="{% url 'home' %}">Back to home</a>{% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
