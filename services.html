{% extends 'base.html' %}
{% block title %}Services{% endblock %}
{% block content %}
<h1 class="h3 mb-4">All services</h1>
<div class="row g-3">
  {% for c in categories %}
    <div class="col-6 col-md-4 col-lg-3">
      <a class="card cat-card h-100 text-center p-4" href="{% url 'providers' %}?category={{ c.pk }}">
        <div><span class="cat-icon"><i class="bi {{ c.icon }}"></i></span></div>
        <div class="fw-semibold mt-2">{{ c.name }}</div>
        <div class="small text-muted">{{ c.description }}</div>
      </a>
    </div>
  {% empty %}
    <p class="text-muted">No services available yet.</p>
  {% endfor %}
</div>
{% endblock %}
